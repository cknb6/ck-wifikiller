# tag 触发：在 Debian 容器构建 .deb 并自动发布 GitHub Release
# 本地不构建；CI 内完成 dpkg-buildpackage
name: Build and Release Deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    outputs:
      version: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential debhelper dh-python python3-all python3-setuptools \
            python3-pybuild dpkg-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 去掉 v 前缀，作为 deb 上游版本
          UPSTREAM="${TAG#v}"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Sync debian/changelog with tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          UPSTREAM: ${{ steps.ver.outputs.upstream }}
        run: |
          set -e
          DATE=$(date -R)
          cat > debian/changelog <<EOF
          ck-wifikiller (${UPSTREAM}-1) unstable; urgency=medium

            * Automated release for ${TAG}.
            * PMKID hashcat rules/mask/increment; CN WiFi optimization; WPA3 transition detection.
            * Router OUI vendor advisory; dynamic versioning; session logging.

           -- ck-wifikiller <1837620622@qq.com>  ${DATE}
          EOF

      - name: Build .deb
        run: |
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          mv ../ck-wifikiller_*.deb artifacts/ || true
          mv ../ck-wifikiller_*.build artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ck-wifikiller-deb
          path: artifacts/*.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*.deb

  apt-repo:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: ck-wifikiller-deb
          path: debs

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils git

      - name: Configure git
        run: |
          git config --global user.name "ck-wifikiller-ci"
          git config --global user.email "1837620622@qq.com"

      - name: Clone or init gh-pages
        run: |
          git clone --depth=1 --branch=gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo 2>/dev/null || \
          mkdir -p repo && cd repo && git init && git checkout -b gh-pages
          cd repo
          # 清旧 pool 同名包，保留历史其它版本
          rm -f pool/main/c/ck-wifikiller/*.deb 2>/dev/null || true
          mkdir -p pool/main/c/ck-wifikiller dists/stable/main/binary-all

      - name: Place .deb into pool
        run: |
          cp debs/*.deb repo/pool/main/c/ck-wifikiller/
          ls -la repo/pool/main/c/ck-wifikiller/

      - name: Generate Packages index
        run: |
          cd repo
          dpkg-scanpackages --arch all pool /dev/null > dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

      - name: Generate Release file
        run: |
          cd repo/dists/stable
          apt-ftparchive release . > Release
          cat Release

      - name: Commit and push gh-pages
        run: |
          cd repo
          git add -A
          git commit -m "apt repo: publish ${{ needs.build-deb.outputs.version }} [skip ci]" || \
            git commit --allow-empty -m "apt repo: publish ${{ needs.build-deb.outputs.version }} [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
