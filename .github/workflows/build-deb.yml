# tag 触发：构建 .deb、用 Actions 部署 apt 仓库到 GitHub Pages、发布 Release
name: Build and Release Deb

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v2.5.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      upstream: ${{ steps.version.outputs.upstream }}
    steps:
      - name: Install build dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential debhelper dh-python \
            python3-all python3-setuptools python3-wheel \
            dpkg-dev lintian
          git config --global --add safe.directory '*'

      - name: Validate release tag
        id: version
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+~][0-9A-Za-z.+~]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_REF" >&2
            exit 1
          fi
          upstream="${RELEASE_REF#v}"
          dpkg --validate-version "$upstream"
          echo "tag=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Synchronize Debian changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        shell: bash
        run: |
          set -euo pipefail
          release_date="$(git show -s --format=%cD "${TAG}^{commit}")"
          cat > debian/changelog <<EOF
          ck-wifikiller (${UPSTREAM}) unstable; urgency=medium

            * Automated release for ${TAG}.

           -- 传康Kk <1837620622@qq.com>  ${release_date}
          EOF

      - name: Build and validate Debian package
        env:
          CK_WIFI_VERSION: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          dpkg-buildpackage -us -uc -b

          shopt -s nullglob
          packages=(../ck-wifikiller_*.deb)
          changes=(../ck-wifikiller_*.changes)
          if (( ${#packages[@]} == 0 )); then
            echo "dpkg-buildpackage completed without producing a .deb" >&2
            exit 1
          fi
          lintian --fail-on error "${changes[@]}"
          mkdir -p artifacts
          mv -- "${packages[@]}" artifacts/
          (
            cd artifacts
            sha256sum -- *.deb > SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ck-wifikiller-deb-${{ steps.version.outputs.tag }}
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # 用 GitHub Actions Pages 部署 apt 仓库（避免 legacy gh-pages 对大二进制构建失败）
  apt-repo:
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: ck-wifikiller-apt-repository
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Debian artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ck-wifikiller-deb-${{ needs.build-deb.outputs.tag }}
          path: debs

      - name: Install repository tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev apt-utils curl

      - name: Build APT repository tree
        env:
          EXPECTED_VERSION: ${{ needs.build-deb.outputs.upstream }}
          TAG: ${{ needs.build-deb.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd debs
            sha256sum -c SHA256SUMS
          )

          shopt -s nullglob
          packages=(debs/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "no .deb in artifact" >&2
            exit 1
          fi

          # 合并历史 deb：从当前线上 pool 拉取旧版本（失败则仅本次版本）
          mkdir -p site/pool/main/c/ck-wifikiller
          # 合并历史 deb（从 Releases 拉取，失败则跳过）
          for ver in 2.5.0 2.5.1 2.5.2 2.5.3 2.5.4 2.5.5 2.5.6 2.5.7 2.5.8 2.5.9 2.5.10 2.5.11 2.5.12; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}/ck-wifikiller_${ver}_all.deb"
            dest="site/pool/main/c/ck-wifikiller/ck-wifikiller_${ver}_all.deb"
            if curl -fsSL "$url" -o "$dest"; then
              echo "cached historical $ver"
            else
              rm -f "$dest"
            fi
          done

          for package in "${packages[@]}"; do
            package_name="$(dpkg-deb -f "$package" Package)"
            package_version="$(dpkg-deb -f "$package" Version)"
            package_arch="$(dpkg-deb -f "$package" Architecture)"
            if [[ "$package_name" != "ck-wifikiller" || "$package_version" != "$EXPECTED_VERSION" || "$package_arch" != "all" ]]; then
              echo "Unexpected package metadata in $package" >&2
              dpkg-deb -I "$package" || true
              exit 1
            fi
            cp -f -- "$package" "site/pool/main/c/ck-wifikiller/$(basename "$package")"
          done

          # 在 site/ 根扫描 pool/，Filename 必须是 pool/... 而非 repo/pool/...
          (
            cd site
            for arch in amd64 arm64 all; do
              index_dir="dists/stable/main/binary-${arch}"
              mkdir -p "$index_dir"
              dpkg-scanpackages --arch all --multiversion pool /dev/null \
                > "$index_dir/Packages"
              gzip -n -9 -c "$index_dir/Packages" > "$index_dir/Packages.gz"
            done

            cd dists/stable
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=ck-wifikiller \
              -o APT::FTPArchive::Release::Label=ck-wifikiller \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64 all" \
              -o APT::FTPArchive::Release::Components=main \
              -o APT::FTPArchive::Release::Description="ck-wifikiller APT repository" \
              release . > Release

            # 未签名：不要生成伪 InRelease（否则 apt NOSPLIT）
            rm -f InRelease Release.gpg
          )

          # 安装说明页
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8">
          <title>ck-wifikiller apt repository</title>
          <style>
          body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.55}
          pre{background:#f4f4f5;padding:1rem;overflow:auto;border-radius:6px}
          .warn{border-left:3px solid #dc2626;padding-left:.75rem;margin:1rem 0}
          </style></head><body>
          <h1>ck-wifikiller apt repository</h1>
          <p>Authorized security testing only. 仅限授权安全测试。</p>
          <div class="warn"><strong>必须先加源</strong>：Kali 官方源没有本包。
          只运行 <code>apt install ck-wifikiller</code> 会「无法定位软件包」。</div>
          <h2>Install</h2>
          <pre>echo "deb [trusted=yes] https://cknb6.github.io/ck-wifikiller stable main" \
            | sudo tee /etc/apt/sources.list.d/ck-wifikiller.list
          sudo apt update
          apt-cache policy ck-wifikiller
          sudo apt install -y ck-wifikiller</pre>
          <h2>Fallback</h2>
          <pre>curl -LO https://github.com/cknb6/ck-wifikiller/releases/latest/download/ck-wifikiller_*.deb
          # 或打开 Releases 页面手动下载 .deb
          sudo apt install -y ./ck-wifikiller_*.deb</pre>
          <p><a href="https://github.com/cknb6/ck-wifikiller">Source</a></p>
          </body></html>
          HTML

          # 校验
          if grep -q 'Filename: repo/' site/dists/stable/main/binary-amd64/Packages; then
            echo "bad Filename prefix" >&2
            exit 1
          fi
          if ! grep -q "Version: ${EXPECTED_VERSION}" site/dists/stable/main/binary-amd64/Packages; then
            echo "missing version ${EXPECTED_VERSION} in Packages" >&2
            exit 1
          fi
          if [[ -e site/dists/stable/InRelease ]]; then
            echo "unsigned repo must not ship InRelease" >&2
            exit 1
          fi
          test -f "site/pool/main/c/ck-wifikiller/ck-wifikiller_${EXPECTED_VERSION}_all.deb"
          echo "APT tree ready for ${TAG}"

      - name: Local apt smoke test
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_WORKSPACE}/site"
          for arch in amd64 arm64; do
            apt_root="${RUNNER_TEMP}/apt-smoke-${arch}"
            mkdir -p "$apt_root/etc" "$apt_root/lists/partial" "$apt_root/cache/archives/partial"
            printf 'deb [arch=%s trusted=yes] file:%s stable main\n' \
              "$arch" "$repository" > "$apt_root/etc/sources.list"
            apt_options=(
              -o "APT::Architecture=${arch}"
              -o "Dir::Etc::sourcelist=${apt_root}/etc/sources.list"
              -o "Dir::Etc::sourceparts=-"
              -o "Dir::State::lists=${apt_root}/lists"
              -o "Dir::Cache::archives=${apt_root}/cache/archives"
            )
            sudo apt-get "${apt_options[@]}" update
            apt-cache "${apt_options[@]}" policy ck-wifikiller | tee /dev/stderr | grep -q Candidate
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  publish-release:
    needs:
      - build-deb
      - apt-repo
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ck-wifikiller-deb-${{ needs.build-deb.outputs.tag }}
          path: artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-deb.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.deb artifacts/SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/*.deb artifacts/SHA256SUMS \
              --verify-tag --generate-notes --title "$TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
